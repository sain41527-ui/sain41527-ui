<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Success Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f0f0f, #1e1e1e, #111);
      overflow: hidden;
      color: white;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255, 215, 0, 0.15);
      border-radius: 50%;
      filter: blur(100px);
      animation: moveGlow 6s infinite alternate ease-in-out;
    }

    .glow:nth-child(1) {
      top: -100px;
      left: -100px;
    }

    .glow:nth-child(2) {
      bottom: -120px;
      right: -120px;
      background: rgba(255, 255, 255, 0.08);
    }

    @keyframes moveGlow {
      from {
        transform: translateY(0px) translateX(0px);
      }
      to {
        transform: translateY(40px) translateX(30px);
      }
    }

    .success-card {
      position: relative;
      width: 420px;
      padding: 45px 35px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      text-align: center;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .checkmark {
      width: 90px;
      height: 90px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd700, #ffb700);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 42px;
      color: #111;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
    }

    h1 {
      font-size: 34px;
      margin-bottom: 12px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    p {
      font-size: 15px;
      color: rgba(255,255,255,0.75);
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 34px;
      border-radius: 40px;
      text-decoration: none;
      background: linear-gradient(135deg, #ffd700, #ffb700);
      color: #111;
      font-weight: 600;
      transition: 0.3s ease;
      box-shadow: 0 8px 20px rgba(255, 215, 0, 0.35);
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 25px rgba(255, 215, 0, 0.5);
    }

    .footer-text {
      margin-top: 22px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
    }
  </style>
</head>
<body>

  <div class="glow"></div>
  <div class="glow"></div>

  <div class="success-card">
    <div class="checkmark">✓</div>
    <h1>Success!</h1>
    <p>
      Your form has been submitted successfully.<br>
      Thank you for connecting with us.
    </p>

    <a href="index.html" class="btn">Back to Home</a>

    <div class="footer-text">
      Luxury Experience • Premium Design
    </div>
  </div>

</body>
</html>

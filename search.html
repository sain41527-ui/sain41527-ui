<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aesthetic Search Page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
        radial-gradient(circle at top left,#7f5af0,#2cb67d),
        linear-gradient(135deg,#16161a,#242629);
      overflow:hidden;
    }

    .glass-card{
      width:90%;
      max-width:700px;
      padding:50px;
      border-radius:30px;
      background:rgba(255,255,255,0.12);
      backdrop-filter:blur(15px);
      border:1px solid rgba(255,255,255,0.2);
      box-shadow:0 8px 32px rgba(0,0,0,0.35);
      text-align:center;
      color:white;
    }

    .logo{
      font-size:3rem;
      font-weight:600;
      letter-spacing:2px;
      margin-bottom:15px;
      background:linear-gradient(to right,#ffffff,#b8c1ec);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle{
      font-size:1rem;
      opacity:0.8;
      margin-bottom:35px;
    }

    .search-box{
      display:flex;
      align-items:center;
      background:rgba(255,255,255,0.15);
      border-radius:60px;
      padding:10px;
      transition:0.3s ease;
      border:1px solid rgba(255,255,255,0.15);
    }

    .search-box:hover{
      transform:translateY(-3px);
      box-shadow:0 8px 20px rgba(0,0,0,0.2);
    }

    .search-box input{
      flex:1;
      border:none;
      outline:none;
      background:transparent;
      color:white;
      font-size:1rem;
      padding:15px 20px;
    }

    .search-box input::placeholder{
      color:rgba(255,255,255,0.7);
    }

    .search-btn{
      border:none;
      outline:none;
      background:linear-gradient(135deg,#7f5af0,#2cb67d);
      color:white;
      padding:15px 28px;
      border-radius:50px;
      font-size:1rem;
      cursor:pointer;
      transition:0.3s ease;
      font-weight:500;
    }

    .search-btn:hover{
      transform:scale(1.05);
      opacity:0.9;
    }

    .quick-links{
      margin-top:30px;
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    .quick-links a{
      text-decoration:none;
      color:white;
      padding:10px 18px;
      border-radius:30px;
      background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.1);
      transition:0.3s;
      font-size:0.9rem;
    }

    .quick-links a:hover{
      background:white;
      color:#16161a;
      transform:translateY(-2px);
    }

    @media(max-width:600px){
      .glass-card{
        padding:35px 20px;
      }

      .logo{
        font-size:2.2rem;
      }

      .search-box{
        flex-direction:column;
        border-radius:20px;
      }

      .search-box input{
        width:100%;
      }

      .search-btn{
        width:100%;
        margin-top:10px;
      }
    }
  </style>
</head>

<body>

  <div class="glass-card">
    <h1 class="logo">Searchify</h1>
    <p class="subtitle">
      Explore the world beautifully ✨
    </p>

    <div class="search-box">
      <input type="text" placeholder="Search anywhere..." />
      <button class="search-btn">Search</button>
    </div>

    <div class="quick-links">
      <a href="#">country</a>
      <a href="#">area</a>
      <a href="#">village</a>
      <a href="#">rural</a>
      <a href="#">town</a>
    </div>
  </div>

</body>
</html>
